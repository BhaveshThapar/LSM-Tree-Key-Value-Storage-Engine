[package]
name = "lsm_kv"
version = "0.1.0"
edition = "2021"
description = "A log-structured merge-tree key/value storage engine"

[[bin]]
name = "lsm"
path = "src/bin/lsm.rs"

[dependencies]
thiserror = "2"
crc32fast = "1"
lz4_flex = "0.11"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
parking_lot = "0.12"

[dev-dependencies]
tempfile = "3"
criterion = "0.5"
rocksdb = "0.22"
rand = "0.8"
proptest = "1"

[features]
# Re-exports internal decoders for the `fuzz/` cargo-fuzz crate.
fuzzing = []

[[bench]]
name = "engine"
harness = false

[[bench]]
name = "ycsb"
harness = false

[profile.release]
lto = true
codegen-units = 1
