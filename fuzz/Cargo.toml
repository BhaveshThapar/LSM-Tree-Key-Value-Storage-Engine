[package]
name = "lsm_kv-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.lsm_kv]
path = ".."
features = ["fuzzing"]

[[bin]]
name = "record_decode"
path = "fuzz_targets/record_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "wal_replay"
path = "fuzz_targets/wal_replay.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sstable_open"
path = "fuzz_targets/sstable_open.rs"
test = false
doc = false
bench = false
